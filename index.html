<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>施術設計＆進行管理アプリ</title>
  <style>
    :root {
      --bg: #f4f5f7;
      --card: #ffffff;
      --card-soft: #fafbfc;
      --text: #1f2937;
      --muted: #6b7280;
      --border: #dbe2ea;
      --accent: #0a84ff;
      --accent-soft: #e8f2ff;
      --warn: #b84a4a;
      --warn-bg: #fff7f7;
      --ok: #198754;
      --shadow: 0 8px 30px rgba(15, 23, 42, 0.06);
      --radius: 16px;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      font-size: 18px;
      line-height: 1.45;
      color: var(--text);
      background: var(--bg);
    }
    .app {
      max-width: 1220px;
      margin: 0 auto;
      padding: 20px;
    }
    .screen { display: none; }
    .screen.active { display: block; }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 22px;
      margin-bottom: 16px;
    }
    h1 { font-size: 30px; margin: 0 0 10px; }
    h2 { font-size: 24px; margin: 0 0 10px; }
    h3 { font-size: 20px; margin: 0 0 10px; }
    .muted { color: var(--muted); font-size: 15px; }
    .field { margin-bottom: 16px; }
    .field > label { display:block; margin-bottom:8px; font-weight: 650; }
    input[type="text"], input[type="number"], select {
      width: 100%;
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px 14px;
      font-size: 17px;
      background: #fff;
    }
    .switch {
      display:flex; align-items:center; justify-content:space-between;
      border: 1px solid var(--border); background:#fff; border-radius: 12px; padding: 12px 14px;
    }
    .chip-grid {
      display:grid;
      grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
      gap: 10px;
    }
    .chip {
      border:1px solid var(--border);
      background:#fff;
      border-radius:999px;
      padding:10px 12px;
      text-align:center;
      cursor:pointer;
      user-select:none;
      font-size:16px;
    }
    .chip.on {
      border-color: var(--accent);
      color: var(--accent);
      background: var(--accent-soft);
      font-weight: 700;
    }
    .btn-row { display:flex; gap:10px; flex-wrap:wrap; }
    button {
      border: none;
      border-radius: 14px;
      padding: 13px 18px;
      font-size: 18px;
      font-weight: 700;
      cursor: pointer;
      min-width: 130px;
    }
    button:disabled { opacity: .45; cursor:not-allowed; }
    .btn-primary { background: var(--accent); color:#fff; }
    .btn-secondary { background: #e9edf2; color: var(--text); }
    .btn-ghost { background: #fff; border:1px solid var(--border); color: var(--text); }
    .btn-danger-soft { background: #fff1f1; color: #a83838; }
    .summary-grid {
      display:grid;
      grid-template-columns: repeat(4, minmax(130px, 1fr));
      gap: 10px;
    }
    .summary-item { border:1px solid var(--border); border-radius:12px; background:var(--card-soft); padding:12px; }
    .summary-item .k { font-size:13px; color:var(--muted); }
    .summary-item .v { font-size:20px; font-weight:800; }
    .stack {
      width:100%; min-height:58px; border-radius:12px; overflow:hidden;
      border:1px solid var(--border); display:flex; background:#edf1f6;
    }
    .seg {
      min-width:68px;
      color:#fff; font-size:13px; font-weight:700; text-align:center;
      display:flex; align-items:center; justify-content:center;
      padding:4px;
    }
    .edit-grid { display:grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px; }
    .panel { background: var(--card-soft); border:1px solid var(--border); border-radius:12px; padding:10px; min-height:280px; }
    .node { background:#fff; border:1px solid var(--border); border-radius:12px; padding:8px; margin-bottom:9px; }
    .node.selected { border-color: var(--accent); box-shadow: inset 0 0 0 1px rgba(10,132,255,0.2); background: var(--accent-soft); }
    .node-grid { display:grid; grid-template-columns: 1fr 95px; gap:8px; margin-bottom:8px; }
    .small { font-size: 14px; padding: 7px 10px; min-width: 76px; }
    .help { color:var(--muted); font-size:14px; }
    .warn {
      border:1px solid #f1c8c8; background: var(--warn-bg); border-radius:12px; padding:10px;
    }
    .warn h4 { margin:0 0 8px; color: var(--warn); }
    .warn ul { margin:0 0 0 18px; }
    .preview-card summary { cursor:pointer; font-weight:700; }
    .preview {
      border:1px dashed var(--border);
      border-radius:10px;
      padding:10px;
      background:#fcfdff;
      color:#4b5563;
      font-size:14px;
      overflow:auto;
      max-height:220px;
      margin-top:8px;
      white-space:pre-wrap;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    }
    .timer-main {
      display:grid;
      grid-template-columns: 1.2fr .8fr;
      gap:12px;
    }
    .timer-big {
      font-size: clamp(42px, 7vw, 72px);
      line-height:1;
      font-weight: 800;
      letter-spacing: 1px;
      margin: 8px 0;
    }
    .timer-progress {
      width:100%; height:16px; border-radius:999px; background:#e9eef5; overflow:hidden; border:1px solid var(--border);
    }
    .timer-progress > div { height:100%; background: linear-gradient(90deg, #6cb6ff, #0a84ff); transition: width .2s; }
    .step-list { max-height: 380px; overflow:auto; padding-right:4px; }
    .step-item {
      border:1px solid var(--border); background:#fff; border-radius:10px; padding:9px; margin-bottom:8px; font-size:15px;
    }
    .step-item.done { opacity:.55; }
    .step-item.current { border-color: var(--accent); background: var(--accent-soft); }
    .pulse { animation: pulse .6s ease; }
    @keyframes pulse {
      0% { transform: scale(1); }
      40% { transform: scale(1.015); }
      100% { transform: scale(1); }
    }
    @media (max-width: 980px) {
      body { font-size: 16px; }
      .app { padding: 12px; }
      .summary-grid { grid-template-columns: repeat(2, minmax(120px, 1fr)); }
      .edit-grid { grid-template-columns: 1fr; }
      .timer-main { grid-template-columns: 1fr; }
      button { font-size: 16px; }
    }
  </style>
</head>
<body>
  <div class="app">
    <section id="survey-screen" class="screen active"></section>
    <section id="schedule-screen" class="screen"></section>
    <section id="timer-screen" class="screen"></section>
  </div>

<script>
  const MENU_OPTIONS = [
    { id: 'custom', label: 'カスタム' },
    { id: 'bodywork', label: 'もみほぐし' },
    { id: 'foot', label: '足ツボ' },
    { id: 'bodywork_foot', label: 'もみほぐし＋足ツボ' }
  ];
  const DURATION_OPTIONS = {
    bodywork: [60, 75, 90, 120],
    foot: [30, 60],
    bodywork_foot: [60, 90, 120]
  };
  const FOCUS_OPTIONS = [
    { id: 'neck', label: '首' },
    { id: 'shoulder', label: '肩' },
    { id: 'back', label: '背中' },
    { id: 'lower_back', label: '腰' },
    { id: 'sole', label: '足裏' },
    { id: 'calf', label: 'ふくらはぎ' },
    { id: 'head', label: '頭' },
    { id: 'arm', label: '腕' },
    { id: 'palm', label: '手のひら' },
    { id: 'hip', label: '臀部' }
  ];

  const COLORS = ['#4f8ef7', '#6ec6ca', '#7d9eff', '#5e9dcf', '#7fb069', '#c48b5b'];

  const state = {
    currentScreen: 'survey',
    survey: {
      menuId: null,
      totalDurationMin: null,
      focusAreas: [],
      splitLeftRight: false
    },
    schedule: {
      frames: [],
      blocks: [],
      units: [],
      selection: { frameId: null, blockId: null },
      warnings: [],
      confirmedPayload: null
    },
    timer: {
      flattenedSteps: [],
      currentStepIndex: 0,
      currentRemainingSec: 0,
      totalRemainingSec: 0,
      isRunning: false,
      isPaused: false,
      completedSec: 0,
      uiPulseKey: 0
    }
  };

  let timerInterval = null;

  const $ = (sel, root=document) => root.querySelector(sel);
  const $$ = (sel, root=document) => [...root.querySelectorAll(sel)];
  const uid = (p) => `${p}_${Math.random().toString(36).slice(2,10)}`;
  const nowISO = () => new Date().toISOString();
  const asInt = (v) => {
    const n = Number(v);
    if (!Number.isFinite(n)) return 0;
    return Math.floor(n);
  };
  const sanitizeMin = (v) => Math.max(0, asInt(v));
  const fmtSec = (s) => {
    const sec = Math.max(0, asInt(s));
    const m = Math.floor(sec / 60);
    const r = sec % 60;
    return `${String(m).padStart(2,'0')}:${String(r).padStart(2,'0')}`;
  };
  const esc = (s) => String(s ?? '')
    .replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;')
    .replaceAll('"','&quot;').replaceAll("'", '&#039;');

  function surveyValid() {
    return !!state.survey.menuId && Number.isInteger(state.survey.totalDurationMin) && state.survey.totalDurationMin >= 1;
  }

  function menuLabel(id) {
    return MENU_OPTIONS.find(m => m.id === id)?.label || '未選択';
  }

  function resetTimerState() {
    stopTimerTicker();
    state.timer.flattenedSteps = [];
    state.timer.currentStepIndex = 0;
    state.timer.currentRemainingSec = 0;
    state.timer.totalRemainingSec = 0;
    state.timer.isRunning = false;
    state.timer.isPaused = false;
    state.timer.completedSec = 0;
    state.timer.uiPulseKey += 1;
  }

  function initializeScheduleFromSurvey() {
    const { menuId, totalDurationMin } = state.survey;
    state.schedule.frames = [];
    state.schedule.blocks = [];
    state.schedule.units = [];
    state.schedule.selection = { frameId: null, blockId: null };
    state.schedule.confirmedPayload = null;

    if (menuId === 'bodywork') {
      state.schedule.frames.push({ id: uid('frame'), name: 'もみほぐし', allocatedMin: totalDurationMin, order: 0, areaTag: null, side: null });
    } else if (menuId === 'foot') {
      state.schedule.frames.push({ id: uid('frame'), name: '足ツボ', allocatedMin: totalDurationMin, order: 0, areaTag: null, side: null });
    } else if (menuId === 'bodywork_foot') {
      state.schedule.frames.push({ id: uid('frame'), name: 'もみほぐし', allocatedMin: Math.floor(totalDurationMin/2), order: 0, areaTag: null, side: null });
      state.schedule.frames.push({ id: uid('frame'), name: '足ツボ', allocatedMin: Math.ceil(totalDurationMin/2), order: 1, areaTag: null, side: null });
    }

    recomputeWarnings();
    resetTimerState();
  }

  function recomputeWarnings() {
    const warnings = [];
    const total = state.survey.totalDurationMin ?? 0;
    const frameTotal = state.schedule.frames.reduce((a,f)=>a + sanitizeMin(f.allocatedMin), 0);
    if (frameTotal !== total) warnings.push(`全体不一致: 大枠合計 ${frameTotal}分 / 総時間 ${total}分`);

    for (const f of state.schedule.frames) {
      const blocks = state.schedule.blocks.filter(b => b.frameId === f.id);
      const sum = blocks.reduce((a,b)=>a + sanitizeMin(b.allocatedMin), 0);
      if (sum !== sanitizeMin(f.allocatedMin)) warnings.push(`親子不一致(大枠): ${f.name || '名称未設定'} の子中枠合計 ${sum}分 / 親 ${sanitizeMin(f.allocatedMin)}分`);
    }
    for (const b of state.schedule.blocks) {
      const units = state.schedule.units.filter(u => u.blockId === b.id);
      const sum = units.reduce((a,u)=>a + sanitizeMin(u.allocatedMin), 0);
      if (sum !== sanitizeMin(b.allocatedMin)) warnings.push(`親子不一致(中枠): ${b.name || '名称未設定'} の子小枠合計 ${sum}分 / 親 ${sanitizeMin(b.allocatedMin)}分`);
    }

    const invalids = [];
    [...state.schedule.frames, ...state.schedule.blocks, ...state.schedule.units].forEach((n) => {
      const num = Number(n.allocatedMin);
      if (!Number.isFinite(num) || !Number.isInteger(num) || num < 0) invalids.push(`${n.name || n.id}`);
    });
    if (invalids.length) warnings.push(`値異常: ${invalids.join(' / ')}`);

    const zero = [];
    state.schedule.frames.forEach(n => sanitizeMin(n.allocatedMin) === 0 && zero.push(`大枠:${n.name || n.id}`));
    state.schedule.blocks.forEach(n => sanitizeMin(n.allocatedMin) === 0 && zero.push(`中枠:${n.name || n.id}`));
    state.schedule.units.forEach(n => sanitizeMin(n.allocatedMin) === 0 && zero.push(`小枠:${n.name || n.id}`));
    if (zero.length) warnings.push(`0分項目: ${zero.join(' / ')}`);

    state.schedule.warnings = warnings;
  }

  function getNextOrder(nodes, parentKey, parentId) {
    const filtered = parentKey ? nodes.filter(n => n[parentKey] === parentId) : nodes;
    const maxOrder = filtered.reduce((m,n)=>Math.max(m, asInt(n.order)), -1);
    return maxOrder + 1;
  }

  function sortByOrder(list) {
    return [...list].sort((a,b)=>asInt(a.order)-asInt(b.order));
  }

  function buildPayload() {
    return {
      condition: {
        menuId: state.survey.menuId,
        totalDurationMin: state.survey.totalDurationMin,
        focusAreas: [...state.survey.focusAreas],
        splitLeftRight: state.survey.splitLeftRight,
        inputVersion: 1,
        createdAt: nowISO()
      },
      allocation: {
        totalDurationMin: state.survey.totalDurationMin,
        frames: sortByOrder(state.schedule.frames).map(f => ({...f, allocatedMin: sanitizeMin(f.allocatedMin)})),
        blocks: sortByOrder(state.schedule.blocks).map(b => ({...b, allocatedMin: sanitizeMin(b.allocatedMin)})),
        units: sortByOrder(state.schedule.units).map(u => ({...u, allocatedMin: sanitizeMin(u.allocatedMin)}))
      },
      validation: {
        hasWarning: state.schedule.warnings.length > 0,
        warnings: [...state.schedule.warnings]
      },
      outputVersion: 1,
      updatedAt: nowISO()
    };
  }

  function flattenExecutionSteps() {
    const steps = [];
    const frames = sortByOrder(state.schedule.frames);
    frames.forEach((f) => {
      const fBlocks = sortByOrder(state.schedule.blocks.filter(b => b.frameId === f.id));
      if (!fBlocks.length) {
        steps.push({
          id: uid('step'),
          sourceType: 'frame', sourceId: f.id,
          label: f.name || '名称未設定',
          durationSec: sanitizeMin(f.allocatedMin) * 60
        });
        return;
      }
      fBlocks.forEach((b) => {
        const bUnits = sortByOrder(state.schedule.units.filter(u => u.blockId === b.id));
        if (!bUnits.length) {
          steps.push({
            id: uid('step'),
            sourceType: 'block', sourceId: b.id,
            label: `${f.name || '大枠'} / ${b.name || '中枠'}`,
            durationSec: sanitizeMin(b.allocatedMin) * 60
          });
          return;
        }
        bUnits.forEach((u) => {
          steps.push({
            id: uid('step'),
            sourceType: 'unit', sourceId: u.id,
            label: `${f.name || '大枠'} / ${b.name || '中枠'} / ${u.name || '小枠'}`,
            durationSec: sanitizeMin(u.allocatedMin) * 60
          });
        });
      });
    });

    return steps.filter(s => s.durationSec > 0);
  }

  function prepareTimerFromConfirmed() {
    const steps = flattenExecutionSteps();
    state.timer.flattenedSteps = steps;
    state.timer.currentStepIndex = 0;
    state.timer.currentRemainingSec = steps[0]?.durationSec || 0;
    state.timer.totalRemainingSec = steps.reduce((a,s)=>a+s.durationSec,0);
    state.timer.completedSec = 0;
    state.timer.isRunning = false;
    state.timer.isPaused = false;
    state.timer.uiPulseKey += 1;
  }

  function currentStep() {
    return state.timer.flattenedSteps[state.timer.currentStepIndex] || null;
  }

  function stopTimerTicker() {
    if (timerInterval) clearInterval(timerInterval);
    timerInterval = null;
  }

  function startTimerTicker() {
    if (timerInterval) return;
    timerInterval = setInterval(() => {
      if (!state.timer.isRunning || state.timer.isPaused) return;
      tickOneSecond();
    }, 1000);
  }

  function moveToStep(index, keepRunning=true) {
    const steps = state.timer.flattenedSteps;
    if (!steps.length) return;
    if (index < 0 || index >= steps.length) return;

    const oldIndex = state.timer.currentStepIndex;
    const oldRemain = state.timer.currentRemainingSec;
    if (index > oldIndex) {
      const oldStepTotal = steps[oldIndex]?.durationSec || 0;
      state.timer.completedSec += Math.max(0, oldStepTotal - oldRemain);
      for (let i = oldIndex + 1; i < index; i++) {
        state.timer.completedSec += steps[i].durationSec;
      }
    } else if (index < oldIndex) {
      let rewind = 0;
      for (let i = index; i < oldIndex; i++) rewind += steps[i].durationSec;
      rewind += (steps[oldIndex]?.durationSec || 0) - oldRemain;
      state.timer.completedSec = Math.max(0, state.timer.completedSec - rewind);
    }

    state.timer.currentStepIndex = index;
    state.timer.currentRemainingSec = steps[index].durationSec;
    state.timer.uiPulseKey += 1;
    if (!keepRunning) state.timer.isPaused = true;
  }

  function tickOneSecond() {
    const step = currentStep();
    if (!step) {
      state.timer.isRunning = false;
      state.timer.isPaused = false;
      stopTimerTicker();
      render();
      return;
    }

    if (state.timer.currentRemainingSec > 0) {
      state.timer.currentRemainingSec -= 1;
      state.timer.totalRemainingSec = Math.max(0, state.timer.totalRemainingSec - 1);
      state.timer.completedSec += 1;
    }

    if (state.timer.currentRemainingSec <= 0) {
      const next = state.timer.currentStepIndex + 1;
      if (next < state.timer.flattenedSteps.length) {
        state.timer.currentStepIndex = next;
        state.timer.currentRemainingSec = state.timer.flattenedSteps[next].durationSec;
        state.timer.uiPulseKey += 1;
      } else {
        state.timer.isRunning = false;
        state.timer.isPaused = false;
        state.timer.currentRemainingSec = 0;
        stopTimerTicker();
      }
    }
    render();
  }

  function adjustCurrentStep(secDelta) {
    const step = currentStep();
    if (!step) return;
    const nextRemain = Math.max(1, state.timer.currentRemainingSec + secDelta);
    const delta = nextRemain - state.timer.currentRemainingSec;
    state.timer.currentRemainingSec = nextRemain;
    step.durationSec = Math.max(1, step.durationSec + delta);
    state.timer.totalRemainingSec = Math.max(0, state.timer.totalRemainingSec + delta);
    render();
  }

  function renderSurvey() {
    const root = $('#survey-screen');
    const menuOpts = MENU_OPTIONS.map(m => `<option value="${m.id}" ${state.survey.menuId===m.id?'selected':''}>${m.label}</option>`).join('');
    const durationHTML = state.survey.menuId && state.survey.menuId !== 'custom'
      ? `<select id="duration-select"><option value="">選択してください</option>${(DURATION_OPTIONS[state.survey.menuId]||[]).map(d=>`<option value="${d}" ${state.survey.totalDurationMin===d?'selected':''}>${d}分</option>`).join('')}</select>`
      : `<input id="duration-input" type="number" min="1" step="1" value="${state.survey.totalDurationMin ?? ''}" placeholder="例: 70" />`;
    const chips = FOCUS_OPTIONS.map(f => `<button type="button" class="chip ${state.survey.focusAreas.includes(f.id)?'on':''}" data-focus="${f.id}">${f.label}</button>`).join('');

    root.innerHTML = `
      <div class="card">
        <h1>施術設計＆進行管理アプリ</h1>
        <p class="muted">アンケート → スケジュール作成 → タイマー実行 の3画面を1ページ内で切り替えます。</p>
      </div>
      <div class="card">
        <h2>1. 施術条件入力</h2>
        <div class="field">
          <label for="menu-select">メニュー選択（必須）</label>
          <select id="menu-select"><option value="">選択してください</option>${menuOpts}</select>
        </div>
        <div class="field">
          <label>総時間（必須）</label>
          ${durationHTML}
          <div class="help">カスタム以外は候補選択、カスタムは1分単位の自由入力です。</div>
        </div>
        <div class="field">
          <label>重点部位（任意・複数選択可）</label>
          <div class="chip-grid">${chips}</div>
        </div>
        <div class="field">
          <label>左右を分けるか（任意）</label>
          <div class="switch"><span>左右分割を有効化</span><input id="split-toggle" type="checkbox" ${state.survey.splitLeftRight?'checked':''}></div>
        </div>
        <div class="btn-row">
          <button id="to-schedule" class="btn-primary" ${surveyValid()?'':'disabled'}>次へ</button>
          <button id="survey-to-timer" class="btn-ghost" ${state.schedule.confirmedPayload ? '' : 'disabled'}>タイマー画面へ</button>
        </div>
      </div>
      <div class="card preview-card">
        <details>
          <summary>入力内容の確認（折りたたみ）</summary>
          <div class="preview">${esc(JSON.stringify(state.survey, null, 2))}</div>
        </details>
      </div>
    `;

    $('#menu-select', root).addEventListener('change', (e) => {
      state.survey.menuId = e.target.value || null;
      state.survey.totalDurationMin = null;
      render();
    });
    const ds = $('#duration-select', root);
    if (ds) ds.addEventListener('change', (e) => {
      state.survey.totalDurationMin = e.target.value ? sanitizeMin(e.target.value) : null;
      render();
    });
    const di = $('#duration-input', root);
    if (di) di.addEventListener('input', (e) => {
      state.survey.totalDurationMin = e.target.value ? Math.max(1, sanitizeMin(e.target.value)) : null;
      render();
    });
    $$('[data-focus]', root).forEach(btn => btn.addEventListener('click', () => {
      const id = btn.dataset.focus;
      if (state.survey.focusAreas.includes(id)) {
        state.survey.focusAreas = state.survey.focusAreas.filter(x=>x!==id);
      } else {
        state.survey.focusAreas = [...state.survey.focusAreas, id];
      }
      render();
    }));
    $('#split-toggle', root).addEventListener('change', (e) => {
      state.survey.splitLeftRight = e.target.checked;
      render();
    });
    $('#to-schedule', root).addEventListener('click', () => {
      initializeScheduleFromSurvey();
      state.currentScreen = 'schedule';
      render();
    });
    const surveyToTimer = $('#survey-to-timer', root);
    if (surveyToTimer) {
      surveyToTimer.addEventListener('click', () => {
        if (!state.schedule.confirmedPayload) return;
        if (!state.timer.flattenedSteps.length) prepareTimerFromConfirmed();
        state.currentScreen = 'timer';
        render();
      });
    }
  }

  function renderStackBar() {
    const frames = sortByOrder(state.schedule.frames);
    const total = Math.max(1, state.survey.totalDurationMin || 1);
    if (!frames.length) return '<div class="help">大枠が未作成です。下の「+ 大枠追加」から作成してください。</div>';
    return `<div class="stack">${frames.map((f,i)=>{
      const min = sanitizeMin(f.allocatedMin);
      const pct = (min/total)*100;
      return `<div class="seg" style="width:${Math.max(pct,8)}%;background:${COLORS[i % COLORS.length]}">${esc(f.name||'名称未設定')} ${min}分 ${pct.toFixed(0)}%</div>`;
    }).join('')}</div>`;
  }

  function renderSchedule() {
    recomputeWarnings();
    const root = $('#schedule-screen');
    const selFrame = state.schedule.selection.frameId;
    const selBlock = state.schedule.selection.blockId;
    const frames = sortByOrder(state.schedule.frames);
    const blocks = sortByOrder(state.schedule.blocks.filter(b=>b.frameId===selFrame));
    const units = sortByOrder(state.schedule.units.filter(u=>u.blockId===selBlock));

    root.innerHTML = `
      <div class="card">
        <h1>2. スケジュール作成</h1>
        <div class="summary-grid">
          <div class="summary-item"><div class="k">メニュー</div><div class="v">${esc(menuLabel(state.survey.menuId))}</div></div>
          <div class="summary-item"><div class="k">総時間</div><div class="v">${state.survey.totalDurationMin ?? '-'}分</div></div>
          <div class="summary-item"><div class="k">重点部位数</div><div class="v">${state.survey.focusAreas.length}件</div></div>
          <div class="summary-item"><div class="k">左右分割</div><div class="v">${state.survey.splitLeftRight ? 'ON' : 'OFF'}</div></div>
        </div>
      </div>

      <div class="card"><h3>大枠配分プレビュー</h3>${renderStackBar()}</div>

      <div class="card">
        <div class="edit-grid">
          <div class="panel">
            <h3>大枠</h3>
            ${frames.map(f=>`
              <div class="node ${selFrame===f.id?'selected':''}">
                <div class="node-grid">
                  <input type="text" data-f-name="${f.id}" value="${esc(f.name)}" placeholder="名称" />
                  <input type="number" min="0" step="1" data-f-min="${f.id}" value="${sanitizeMin(f.allocatedMin)}" />
                </div>
                <div class="btn-row">
                  <button class="btn-ghost small" data-f-select="${f.id}">選択</button>
                  <button class="btn-ghost small" data-f-up="${f.id}">↑</button>
                  <button class="btn-ghost small" data-f-down="${f.id}">↓</button>
                  <button class="btn-danger-soft small" data-f-del="${f.id}">削除</button>
                </div>
              </div>
            `).join('')}
            <button id="add-frame" class="btn-secondary">+ 大枠追加</button>
          </div>

          <div class="panel">
            <h3>中枠</h3>
            ${selFrame ? blocks.map(b=>`
              <div class="node ${selBlock===b.id?'selected':''}">
                <div class="node-grid">
                  <input type="text" data-b-name="${b.id}" value="${esc(b.name)}" placeholder="名称" />
                  <input type="number" min="0" step="1" data-b-min="${b.id}" value="${sanitizeMin(b.allocatedMin)}" />
                </div>
                <div class="btn-row">
                  <button class="btn-ghost small" data-b-select="${b.id}">選択</button>
                  <button class="btn-ghost small" data-b-up="${b.id}">↑</button>
                  <button class="btn-ghost small" data-b-down="${b.id}">↓</button>
                  <button class="btn-danger-soft small" data-b-del="${b.id}">削除</button>
                </div>
              </div>
            `).join('') : '<div class="help">先に大枠を選択</div>'}
            <button id="add-block" class="btn-secondary" ${selFrame?'':'disabled'}>+ 中枠追加</button>
          </div>

          <div class="panel">
            <h3>小枠</h3>
            ${selBlock ? units.map(u=>`
              <div class="node">
                <div class="node-grid">
                  <input type="text" data-u-name="${u.id}" value="${esc(u.name)}" placeholder="名称" />
                  <input type="number" min="0" step="1" data-u-min="${u.id}" value="${sanitizeMin(u.allocatedMin)}" />
                </div>
                <div class="btn-row">
                  <button class="btn-ghost small" data-u-up="${u.id}">↑</button>
                  <button class="btn-ghost small" data-u-down="${u.id}">↓</button>
                  <button class="btn-danger-soft small" data-u-del="${u.id}">削除</button>
                </div>
              </div>
            `).join('') : '<div class="help">先に中枠を選択</div>'}
            <button id="add-unit" class="btn-secondary" ${selBlock?'':'disabled'}>+ 小枠追加</button>
          </div>
        </div>
      </div>

      <div class="card">
        <h3>警告一覧（非ブロック）</h3>
        <div class="warn">
          <h4>${state.schedule.warnings.length ? '要確認' : 'OK'}</h4>
          ${state.schedule.warnings.length ? `<ul>${state.schedule.warnings.map(w=>`<li>${esc(w)}</li>`).join('')}</ul>` : '<div class="help">現在、警告はありません。</div>'}
        </div>
        <div class="btn-row" style="margin-top:10px;">
          <button id="back-survey" class="btn-secondary">戻る</button>
          <button id="confirm-schedule" class="btn-primary">この内容で確定</button>
          <button id="to-timer" class="btn-ghost">タイマー画面へ</button>
        </div>
      </div>

      <div class="card preview-card">
        <details ${state.schedule.confirmedPayload ? 'open' : ''}>
          <summary>確定データの確認</summary>
          <div class="preview">${esc(JSON.stringify(state.schedule.confirmedPayload, null, 2) || '未確定')}</div>
        </details>
      </div>
    `;

    $('#back-survey', root).addEventListener('click', () => {
      state.currentScreen = 'survey';
      render();
    });

    $('#add-frame', root).addEventListener('click', () => {
      state.schedule.frames.push({ id: uid('frame'), name: '新しい大枠', allocatedMin: 0, order: getNextOrder(state.schedule.frames), areaTag:null, side:null });
      recomputeWarnings();
      render();
    });

    $('#add-block', root).addEventListener('click', () => {
      const frameId = state.schedule.selection.frameId;
      if (!frameId) return;
      state.schedule.blocks.push({ id: uid('block'), frameId, name:'新しい中枠', allocatedMin:0, order: getNextOrder(state.schedule.blocks, 'frameId', frameId), areaTag:null, side:null });
      recomputeWarnings();
      render();
    });

    $('#add-unit', root).addEventListener('click', () => {
      const blockId = state.schedule.selection.blockId;
      if (!blockId) return;
      state.schedule.units.push({ id: uid('unit'), blockId, name:'新しい小枠', allocatedMin:0, order: getNextOrder(state.schedule.units, 'blockId', blockId), areaTag:null, side:null });
      recomputeWarnings();
      render();
    });

    $$('[data-f-name]', root).forEach(el => el.addEventListener('input', (e)=>{
      const n = state.schedule.frames.find(x=>x.id===e.target.dataset.fName); if(n) n.name = e.target.value; render();
    }));
    $$('[data-f-min]', root).forEach(el => el.addEventListener('input', (e)=>{
      const n = state.schedule.frames.find(x=>x.id===e.target.dataset.fMin); if(n) n.allocatedMin = sanitizeMin(e.target.value); recomputeWarnings(); render();
    }));
    $$('[data-f-select]', root).forEach(el => el.addEventListener('click', ()=>{
      state.schedule.selection.frameId = el.dataset.fSelect;
      const child = state.schedule.blocks.filter(b=>b.frameId===el.dataset.fSelect);
      if (!child.some(b=>b.id===state.schedule.selection.blockId)) state.schedule.selection.blockId = null;
      render();
    }));
    $$('[data-f-del]', root).forEach(el => el.addEventListener('click', ()=>{
      const id = el.dataset.fDel;
      const bid = state.schedule.blocks.filter(b=>b.frameId===id).map(b=>b.id);
      state.schedule.units = state.schedule.units.filter(u=>!bid.includes(u.blockId));
      state.schedule.blocks = state.schedule.blocks.filter(b=>b.frameId!==id);
      state.schedule.frames = state.schedule.frames.filter(f=>f.id!==id);
      if (state.schedule.selection.frameId === id) state.schedule.selection = { frameId:null, blockId:null };
      recomputeWarnings();
      render();
    }));

    $$('[data-b-name]', root).forEach(el => el.addEventListener('input', (e)=>{
      const n = state.schedule.blocks.find(x=>x.id===e.target.dataset.bName); if(n) n.name = e.target.value; render();
    }));
    $$('[data-b-min]', root).forEach(el => el.addEventListener('input', (e)=>{
      const n = state.schedule.blocks.find(x=>x.id===e.target.dataset.bMin); if(n) n.allocatedMin = sanitizeMin(e.target.value); recomputeWarnings(); render();
    }));
    $$('[data-b-select]', root).forEach(el => el.addEventListener('click', ()=>{
      state.schedule.selection.blockId = el.dataset.bSelect;
      render();
    }));
    $$('[data-b-del]', root).forEach(el => el.addEventListener('click', ()=>{
      const id = el.dataset.bDel;
      state.schedule.units = state.schedule.units.filter(u=>u.blockId!==id);
      state.schedule.blocks = state.schedule.blocks.filter(b=>b.id!==id);
      if (state.schedule.selection.blockId === id) state.schedule.selection.blockId = null;
      recomputeWarnings();
      render();
    }));

    $$('[data-u-name]', root).forEach(el => el.addEventListener('input', (e)=>{
      const n = state.schedule.units.find(x=>x.id===e.target.dataset.uName); if(n) n.name = e.target.value; render();
    }));
    $$('[data-u-min]', root).forEach(el => el.addEventListener('input', (e)=>{
      const n = state.schedule.units.find(x=>x.id===e.target.dataset.uMin); if(n) n.allocatedMin = sanitizeMin(e.target.value); recomputeWarnings(); render();
    }));
    $$('[data-u-del]', root).forEach(el => el.addEventListener('click', ()=>{
      const id = el.dataset.uDel;
      state.schedule.units = state.schedule.units.filter(u=>u.id!==id);
      recomputeWarnings();
      render();
    }));

    function moveNode(arr, id, dir, parentKey=null, parentId=null) {
      const target = arr.find(x=>x.id===id);
      if (!target) return;
      const siblings = sortByOrder(parentKey ? arr.filter(x=>x[parentKey]===parentId) : arr);
      const idx = siblings.findIndex(x=>x.id===id);
      const ni = idx + dir;
      if (ni < 0 || ni >= siblings.length) return;
      const other = siblings[ni];
      const t = target.order;
      target.order = other.order;
      other.order = t;
      render();
    }

    $$('[data-f-up]', root).forEach(el => el.addEventListener('click', ()=>moveNode(state.schedule.frames, el.dataset.fUp, -1)));
    $$('[data-f-down]', root).forEach(el => el.addEventListener('click', ()=>moveNode(state.schedule.frames, el.dataset.fDown, 1)));
    $$('[data-b-up]', root).forEach(el => el.addEventListener('click', ()=>moveNode(state.schedule.blocks, el.dataset.bUp, -1, 'frameId', state.schedule.selection.frameId)));
    $$('[data-b-down]', root).forEach(el => el.addEventListener('click', ()=>moveNode(state.schedule.blocks, el.dataset.bDown, 1, 'frameId', state.schedule.selection.frameId)));
    $$('[data-u-up]', root).forEach(el => el.addEventListener('click', ()=>moveNode(state.schedule.units, el.dataset.uUp, -1, 'blockId', state.schedule.selection.blockId)));
    $$('[data-u-down]', root).forEach(el => el.addEventListener('click', ()=>moveNode(state.schedule.units, el.dataset.uDown, 1, 'blockId', state.schedule.selection.blockId)));

    $('#confirm-schedule', root).addEventListener('click', () => {
      recomputeWarnings();
      state.schedule.confirmedPayload = buildPayload();
      prepareTimerFromConfirmed();
      render();
    });

    $('#to-timer', root).addEventListener('click', () => {
      if (!state.schedule.confirmedPayload) {
        recomputeWarnings();
        state.schedule.confirmedPayload = buildPayload();
        prepareTimerFromConfirmed();
      }
      state.currentScreen = 'timer';
      render();
    });
  }

  function renderTimer() {
    const root = $('#timer-screen');
    const step = currentStep();
    const steps = state.timer.flattenedSteps;
    const next = steps[state.timer.currentStepIndex + 1] || null;
    const total = Math.max(1, steps.reduce((a,s)=>a+s.durationSec,0));
    const done = state.timer.completedSec;
    const progress = Math.min(100, (done / total) * 100);

    root.innerHTML = `
      <div class="card">
        <h1>3. タイマー実行</h1>
        <p class="muted">確定済みスケジュールを順番に実行します。工程終了で自動的に次へ進みます。</p>
      </div>

      <div class="card ${state.timer.uiPulseKey ? 'pulse' : ''}">
        ${!steps.length ? `
          <div class="help">実行ステップがありません。スケジュール画面で「この内容で確定」を押してください。</div>
          <div style="margin-top:10px;">
            <button id="create-steps-now" class="btn-primary">現在のスケジュールからタイマーを生成</button>
          </div>
        ` : `
          <div class="timer-main">
            <div>
              <div class="muted">現在の工程</div>
              <h2>${esc(step?.label || '完了')}</h2>
              <div class="timer-big">${fmtSec(state.timer.currentRemainingSec)}</div>
              <div class="muted">次の工程: ${esc(next?.label || 'なし')}</div>
              <div style="margin-top:12px;" class="muted">全体残り: <strong>${fmtSec(state.timer.totalRemainingSec)}</strong></div>
              <div style="margin-top:8px;" class="timer-progress"><div style="width:${progress.toFixed(1)}%"></div></div>
              <div class="help" style="margin-top:4px;">進捗 ${progress.toFixed(1)}%</div>
            </div>
            <div>
              <div class="step-list">
                ${steps.map((s,i)=>`<div class="step-item ${i < state.timer.currentStepIndex ? 'done' : ''} ${i === state.timer.currentStepIndex ? 'current' : ''}">${i+1}. ${esc(s.label)} (${fmtSec(i===state.timer.currentStepIndex ? state.timer.currentRemainingSec : s.durationSec)})</div>`).join('')}
              </div>
            </div>
          </div>
        `}
      </div>

      <div class="card">
        <div class="btn-row">
          <button id="timer-start" class="btn-primary" ${steps.length ? '' : 'disabled'}>開始</button>
          <button id="timer-pause" class="btn-secondary" ${state.timer.isRunning && !state.timer.isPaused ? '' : 'disabled'}>一時停止</button>
          <button id="timer-resume" class="btn-secondary" ${state.timer.isRunning && state.timer.isPaused ? '' : 'disabled'}>再開</button>
          <button id="timer-prev" class="btn-ghost" ${state.timer.currentStepIndex > 0 ? '' : 'disabled'}>戻る</button>
          <button id="timer-next" class="btn-ghost" ${state.timer.currentStepIndex < steps.length - 1 ? '' : 'disabled'}>次へ</button>
          <button id="plus30" class="btn-ghost" ${step ? '' : 'disabled'}>+30秒</button>
          <button id="plus60" class="btn-ghost" ${step ? '' : 'disabled'}>+1分</button>
          <button id="minus30" class="btn-ghost" ${step ? '' : 'disabled'}>-30秒</button>
          <button id="minus60" class="btn-ghost" ${step ? '' : 'disabled'}>-1分</button>
          <button id="timer-reset" class="btn-danger-soft" ${steps.length ? '' : 'disabled'}>最初からやり直し</button>
          <button id="back-schedule" class="btn-secondary">スケジュール画面に戻る</button>
        </div>
      </div>
    `;

    $('#timer-start', root).addEventListener('click', () => {
      if (!state.timer.flattenedSteps.length) return;
      state.timer.isRunning = true;
      state.timer.isPaused = false;
      startTimerTicker();
      render();
    });
    $('#timer-pause', root).addEventListener('click', () => {
      state.timer.isPaused = true;
      render();
    });
    $('#timer-resume', root).addEventListener('click', () => {
      state.timer.isPaused = false;
      state.timer.isRunning = true;
      startTimerTicker();
      render();
    });
    $('#timer-prev', root).addEventListener('click', () => moveToStep(state.timer.currentStepIndex - 1));
    $('#timer-next', root).addEventListener('click', () => moveToStep(state.timer.currentStepIndex + 1));
    $('#plus30', root).addEventListener('click', () => adjustCurrentStep(30));
    $('#plus60', root).addEventListener('click', () => adjustCurrentStep(60));
    $('#minus30', root).addEventListener('click', () => adjustCurrentStep(-30));
    $('#minus60', root).addEventListener('click', () => adjustCurrentStep(-60));
    $('#timer-reset', root).addEventListener('click', () => { prepareTimerFromConfirmed(); render(); });
    $('#back-schedule', root).addEventListener('click', () => {
      stopTimerTicker();
      state.timer.isRunning = false;
      state.timer.isPaused = false;
      state.currentScreen = 'schedule';
      render();
    });
    const createStepsNow = $('#create-steps-now', root);
    if (createStepsNow) {
      createStepsNow.addEventListener('click', () => {
        recomputeWarnings();
        state.schedule.confirmedPayload = buildPayload();
        prepareTimerFromConfirmed();
        render();
      });
    }
  }

  function render() {
    ['survey','schedule','timer'].forEach(name => {
      const el = document.getElementById(`${name}-screen`);
      el.classList.toggle('active', state.currentScreen === name);
    });

    if (state.currentScreen === 'survey') renderSurvey();
    if (state.currentScreen === 'schedule') renderSchedule();
    if (state.currentScreen === 'timer') renderTimer();
  }

  render();
</script>
</body>
</html>
