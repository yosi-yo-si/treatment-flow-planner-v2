<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>施術設計ツール 初版</title>
  <style>
    :root {
      --bg: #f5f6f8;
      --surface: #ffffff;
      --surface-soft: #f0f2f5;
      --text: #1f2933;
      --subtext: #6b7785;
      --border: #d8dde5;
      --accent: #007aff;
      --danger: #c94a4a;
      --radius: 16px;
      --shadow: 0 8px 24px rgba(15, 23, 42, 0.06);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      line-height: 1.5;
      font-size: 18px;
    }

    .app {
      max-width: 1160px;
      margin: 0 auto;
      padding: 24px;
    }

    .screen { display: none; }
    .screen.active { display: block; }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 24px;
      margin-bottom: 20px;
    }

    h1, h2, h3 {
      margin-top: 0;
      letter-spacing: 0.02em;
    }

    h1 { font-size: 32px; margin-bottom: 8px; }
    h2 { font-size: 24px; margin-bottom: 12px; }
    h3 { font-size: 20px; margin-bottom: 10px; }

    .muted {
      color: var(--subtext);
      font-size: 15px;
    }

    .field {
      margin-bottom: 20px;
    }

    .field label {
      display: block;
      margin-bottom: 8px;
      font-weight: 600;
    }

    input[type="text"],
    input[type="number"],
    select {
      width: 100%;
      padding: 12px 14px;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: #fff;
      font-size: 17px;
    }

    .chip-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
      gap: 10px;
    }

    .chip {
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 10px 14px;
      text-align: center;
      background: #fff;
      cursor: pointer;
      user-select: none;
      font-size: 16px;
    }

    .chip.selected {
      border-color: var(--accent);
      color: var(--accent);
      background: #f2f8ff;
      font-weight: 600;
    }

    .switch-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 12px 14px;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: #fff;
    }

    .btn-row {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
    }

    button {
      border: none;
      border-radius: 14px;
      font-size: 18px;
      font-weight: 600;
      padding: 14px 20px;
      cursor: pointer;
      min-width: 140px;
    }

    .btn-primary { background: var(--accent); color: #fff; }
    .btn-secondary { background: var(--surface-soft); color: var(--text); }
    .btn-danger-soft { background: #fff1f1; color: var(--danger); }

    button:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }

    .preview {
      background: #fafbfc;
      border: 1px dashed var(--border);
      border-radius: 12px;
      padding: 14px;
      font-size: 14px;
      color: var(--subtext);
      max-height: 260px;
      overflow: auto;
    }

    .summary-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(120px, 1fr));
      gap: 12px;
    }

    .summary-item {
      background: #fafbfc;
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px;
    }

    .summary-item .label { font-size: 13px; color: var(--subtext); }
    .summary-item .value { font-size: 20px; font-weight: 700; }

    .stacked-bar {
      display: flex;
      width: 100%;
      min-height: 56px;
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid var(--border);
      background: #eef1f5;
    }

    .segment {
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      color: #fff;
      font-size: 13px;
      font-weight: 600;
      padding: 6px;
      min-width: 60px;
    }

    .three-columns {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 14px;
    }

    .panel {
      background: #fafbfc;
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px;
      min-height: 250px;
    }

    .list-item {
      border: 1px solid var(--border);
      border-radius: 12px;
      background: #fff;
      padding: 10px;
      margin-bottom: 10px;
    }

    .list-item.selected {
      border-color: var(--accent);
      box-shadow: inset 0 0 0 1px rgba(0, 122, 255, 0.15);
      background: #f2f8ff;
    }

    .inline-grid {
      display: grid;
      grid-template-columns: 1fr 100px;
      gap: 8px;
      margin-bottom: 8px;
    }

    .item-actions {
      display: flex;
      gap: 8px;
    }

    .small-btn {
      font-size: 14px;
      padding: 8px 10px;
      min-width: 84px;
    }

    .warnings {
      border: 1px solid #f6d6d6;
      background: #fff8f8;
      border-radius: 12px;
      padding: 12px;
    }

    .warnings ul { margin: 8px 0 0 20px; }

    .empty-msg {
      color: var(--subtext);
      font-size: 15px;
      padding: 8px;
    }

    .help {
      font-size: 14px;
      color: var(--subtext);
      margin-top: 8px;
    }

    @media (max-width: 900px) {
      body { font-size: 16px; }
      .app { padding: 14px; }
      .summary-grid { grid-template-columns: repeat(2, minmax(120px, 1fr)); }
      .three-columns { grid-template-columns: 1fr; }
      h1 { font-size: 28px; }
    }
  </style>
</head>
<body>
<div class="app">
  <section id="survey-screen" class="screen active"></section>
  <section id="schedule-screen" class="screen"></section>
</div>

<script>
  const MENU_OPTIONS = [
    { id: "custom", label: "カスタム" },
    { id: "bodywork", label: "もみほぐし" },
    { id: "foot", label: "足ツボ" },
    { id: "bodywork_foot", label: "もみほぐし＋足ツボ" }
  ];

  const DURATION_OPTIONS = {
    bodywork: [60, 75, 90, 120],
    foot: [30, 60],
    bodywork_foot: [60, 90, 120]
  };

  const FOCUS_OPTIONS = [
    { id: "neck", label: "首" },
    { id: "shoulder", label: "肩" },
    { id: "back", label: "背中" },
    { id: "lower_back", label: "腰" },
    { id: "sole", label: "足裏" },
    { id: "calf", label: "ふくらはぎ" },
    { id: "head", label: "頭" },
    { id: "arm", label: "腕" },
    { id: "palm", label: "手のひら" },
    { id: "hip", label: "臀部" }
  ];

  const framePalette = ["#4f8ef7", "#6ec6ca", "#7d9eff", "#5e9dcf", "#7fb069", "#d18b47"];

  const state = {
    currentScreen: "survey",
    survey: {
      menuId: null,
      totalDurationMin: null,
      focusAreas: [],
      splitLeftRight: false
    },
    schedule: {
      frames: [],
      blocks: [],
      units: [],
      confirmedPayload: null
    },
    selection: {
      frameId: null,
      blockId: null
    },
    warnings: []
  };

  function uid(prefix) {
    return `${prefix}_${Math.random().toString(36).slice(2, 10)}`;
  }

  function nowIso() {
    return new Date().toISOString();
  }

  function sanitizeMin(value) {
    const num = Number(value);
    if (!Number.isFinite(num)) return 0;
    return Math.max(0, Math.floor(num));
  }

  function surveyValid() {
    return !!state.survey.menuId && Number.isInteger(state.survey.totalDurationMin) && state.survey.totalDurationMin >= 1;
  }

  function menuLabel(menuId) {
    return MENU_OPTIONS.find((m) => m.id === menuId)?.label ?? "未選択";
  }

  function initializeScheduleFromSurvey() {
    const { menuId, totalDurationMin } = state.survey;
    state.schedule.frames = [];
    state.schedule.blocks = [];
    state.schedule.units = [];
    state.schedule.confirmedPayload = null;
    state.selection.frameId = null;
    state.selection.blockId = null;

    if (menuId === "bodywork") {
      state.schedule.frames.push({ id: uid("frame"), name: "もみほぐし", allocatedMin: totalDurationMin });
    } else if (menuId === "foot") {
      state.schedule.frames.push({ id: uid("frame"), name: "足ツボ", allocatedMin: totalDurationMin });
    } else if (menuId === "bodywork_foot") {
      const first = Math.floor(totalDurationMin / 2);
      const second = Math.ceil(totalDurationMin / 2);
      state.schedule.frames.push({ id: uid("frame"), name: "もみほぐし", allocatedMin: first });
      state.schedule.frames.push({ id: uid("frame"), name: "足ツボ", allocatedMin: second });
    }

    state.warnings = computeWarnings();
  }

  function frameById(frameId) {
    return state.schedule.frames.find((f) => f.id === frameId);
  }

  function blockById(blockId) {
    return state.schedule.blocks.find((b) => b.id === blockId);
  }

  function computeWarnings() {
    const warnings = [];
    const totalDuration = state.survey.totalDurationMin ?? 0;
    const frameTotal = state.schedule.frames.reduce((sum, f) => sum + sanitizeMin(f.allocatedMin), 0);

    if (frameTotal !== totalDuration) {
      warnings.push(`全体不一致: 大枠合計 ${frameTotal}分 / 総時間 ${totalDuration}分`);
    }

    state.schedule.frames.forEach((frame) => {
      const children = state.schedule.blocks.filter((b) => b.frameId === frame.id);
      const childSum = children.reduce((sum, b) => sum + sanitizeMin(b.allocatedMin), 0);
      if (childSum !== sanitizeMin(frame.allocatedMin)) {
        warnings.push(`親子不一致(大枠): 「${frame.name || "名称未設定"}」 子中枠合計 ${childSum}分 / 親 ${sanitizeMin(frame.allocatedMin)}分`);
      }
    });

    state.schedule.blocks.forEach((block) => {
      const children = state.schedule.units.filter((u) => u.blockId === block.id);
      const childSum = children.reduce((sum, u) => sum + sanitizeMin(u.allocatedMin), 0);
      if (childSum !== sanitizeMin(block.allocatedMin)) {
        warnings.push(`親子不一致(中枠): 「${block.name || "名称未設定"}」 子小枠合計 ${childSum}分 / 親 ${sanitizeMin(block.allocatedMin)}分`);
      }
    });

    const zeroItems = [];
    state.schedule.frames.forEach((f) => { if (sanitizeMin(f.allocatedMin) === 0) zeroItems.push(`大枠: ${f.name || f.id}`); });
    state.schedule.blocks.forEach((b) => { if (sanitizeMin(b.allocatedMin) === 0) zeroItems.push(`中枠: ${b.name || b.id}`); });
    state.schedule.units.forEach((u) => { if (sanitizeMin(u.allocatedMin) === 0) zeroItems.push(`小枠: ${u.name || u.id}`); });

    if (zeroItems.length > 0) {
      warnings.push(`0分項目: ${zeroItems.join(" / ")}`);
    }

    return warnings;
  }

  function updateWarnings() {
    state.warnings = computeWarnings();
  }

  function generatePayload() {
    const timestamp = nowIso();
    return {
      condition: {
        menuId: state.survey.menuId,
        totalDurationMin: state.survey.totalDurationMin,
        focusAreas: [...state.survey.focusAreas],
        splitLeftRight: state.survey.splitLeftRight,
        inputVersion: 1,
        createdAt: timestamp
      },
      allocation: {
        totalDurationMin: state.survey.totalDurationMin,
        frames: state.schedule.frames.map((f) => ({ ...f, allocatedMin: sanitizeMin(f.allocatedMin) })),
        blocks: state.schedule.blocks.map((b) => ({ ...b, allocatedMin: sanitizeMin(b.allocatedMin) })),
        units: state.schedule.units.map((u) => ({ ...u, allocatedMin: sanitizeMin(u.allocatedMin) }))
      },
      validation: {
        hasWarning: state.warnings.length > 0,
        warnings: [...state.warnings]
      },
      outputVersion: 1,
      updatedAt: timestamp
    };
  }

  function selectFrame(frameId) {
    state.selection.frameId = frameId;
    const frameBlocks = state.schedule.blocks.filter((b) => b.frameId === frameId);
    if (!frameBlocks.some((b) => b.id === state.selection.blockId)) {
      state.selection.blockId = null;
    }
  }

  function selectBlock(blockId) {
    state.selection.blockId = blockId;
  }

  function removeFrame(frameId) {
    const blockIds = state.schedule.blocks.filter((b) => b.frameId === frameId).map((b) => b.id);
    state.schedule.units = state.schedule.units.filter((u) => !blockIds.includes(u.blockId));
    state.schedule.blocks = state.schedule.blocks.filter((b) => b.frameId !== frameId);
    state.schedule.frames = state.schedule.frames.filter((f) => f.id !== frameId);
    if (state.selection.frameId === frameId) {
      state.selection.frameId = null;
      state.selection.blockId = null;
    }
    updateWarnings();
    render();
  }

  function removeBlock(blockId) {
    state.schedule.units = state.schedule.units.filter((u) => u.blockId !== blockId);
    state.schedule.blocks = state.schedule.blocks.filter((b) => b.id !== blockId);
    if (state.selection.blockId === blockId) state.selection.blockId = null;
    updateWarnings();
    render();
  }

  function removeUnit(unitId) {
    state.schedule.units = state.schedule.units.filter((u) => u.id !== unitId);
    updateWarnings();
    render();
  }

  function renderSurvey() {
    const screen = document.getElementById("survey-screen");
    const menuOptionsHtml = MENU_OPTIONS.map((m) => `<option value="${m.id}" ${state.survey.menuId === m.id ? "selected" : ""}>${m.label}</option>`).join("");

    const durationInputHtml = state.survey.menuId && state.survey.menuId !== "custom"
      ? `<select id="duration-select"><option value="">選択してください</option>${(DURATION_OPTIONS[state.survey.menuId] || []).map((d) => `<option value="${d}" ${state.survey.totalDurationMin === d ? "selected" : ""}>${d}分</option>`).join("")}</select>`
      : `<input id="duration-input" type="number" min="1" step="1" placeholder="例: 70" value="${state.survey.totalDurationMin ?? ""}" />`;

    const focusChips = FOCUS_OPTIONS.map((f) => {
      const selected = state.survey.focusAreas.includes(f.id) ? "selected" : "";
      return `<button type="button" class="chip ${selected}" data-focus-id="${f.id}">${f.label}</button>`;
    }).join("");

    screen.innerHTML = `
      <div class="card">
        <h1>施術設計ツール</h1>
        <p class="muted">初版は「アンケート → スケジュール作成」の2画面のみです。自動再配分や保存は未実装です。</p>
      </div>

      <div class="card">
        <h2>1. アンケート</h2>

        <div class="field">
          <label for="menu-select">メニュー選択（必須）</label>
          <select id="menu-select">
            <option value="">選択してください</option>
            ${menuOptionsHtml}
          </select>
        </div>

        <div class="field">
          <label>総時間（必須）</label>
          ${durationInputHtml}
          <div class="help">カスタム以外は候補から選択、カスタムは1分刻み自由入力です。</div>
        </div>

        <div class="field">
          <label>重点部位（任意・複数選択）</label>
          <div class="chip-grid">${focusChips}</div>
        </div>

        <div class="field">
          <label>左右を分ける（任意）</label>
          <div class="switch-row">
            <span>左右分割を有効にする</span>
            <input id="split-toggle" type="checkbox" ${state.survey.splitLeftRight ? "checked" : ""} />
          </div>
        </div>

        <div class="btn-row">
          <button id="next-btn" class="btn-primary" ${surveyValid() ? "" : "disabled"}>次へ</button>
        </div>
      </div>

      <div class="card">
        <h3>開発用プレビュー（入力状態）</h3>
        <div class="preview">${escapeHtml(JSON.stringify(state.survey, null, 2))}</div>
      </div>
    `;

    screen.querySelector("#menu-select").addEventListener("change", (e) => {
      const menuId = e.target.value || null;
      state.survey.menuId = menuId;
      state.survey.totalDurationMin = null;
      render();
    });

    const durationSelect = screen.querySelector("#duration-select");
    if (durationSelect) {
      durationSelect.addEventListener("change", (e) => {
        const value = e.target.value;
        state.survey.totalDurationMin = value ? sanitizeMin(value) : null;
        render();
      });
    }

    const durationInput = screen.querySelector("#duration-input");
    if (durationInput) {
      durationInput.addEventListener("input", (e) => {
        const value = e.target.value;
        state.survey.totalDurationMin = value ? Math.max(1, sanitizeMin(value)) : null;
        render();
      });
    }

    screen.querySelectorAll("[data-focus-id]").forEach((btn) => {
      btn.addEventListener("click", () => {
        const id = btn.getAttribute("data-focus-id");
        const exists = state.survey.focusAreas.includes(id);
        state.survey.focusAreas = exists
          ? state.survey.focusAreas.filter((x) => x !== id)
          : [...state.survey.focusAreas, id];
        render();
      });
    });

    screen.querySelector("#split-toggle").addEventListener("change", (e) => {
      state.survey.splitLeftRight = e.target.checked;
      render();
    });

    screen.querySelector("#next-btn").addEventListener("click", () => {
      initializeScheduleFromSurvey();
      state.currentScreen = "schedule";
      render();
    });
  }

  function renderStackedBar() {
    const total = Math.max(1, state.survey.totalDurationMin || 1);
    if (state.schedule.frames.length === 0) {
      return `<div class="empty-msg">大枠がまだありません。追加してください。</div>`;
    }

    return `
      <div class="stacked-bar">
        ${state.schedule.frames.map((frame, idx) => {
          const min = sanitizeMin(frame.allocatedMin);
          const ratio = (min / total) * 100;
          const width = Math.max(ratio, 8);
          const color = framePalette[idx % framePalette.length];
          const text = `${frame.name || "名称未設定"} / ${min}分 / ${ratio.toFixed(0)}%`;
          return `<div class="segment" style="width:${width}%; background:${color}">${text}</div>`;
        }).join("")}
      </div>
    `;
  }

  function renderFrameList() {
    return `
      <div class="panel">
        <h3>大枠</h3>
        ${state.schedule.frames.map((frame) => `
          <div class="list-item ${state.selection.frameId === frame.id ? "selected" : ""}">
            <div class="inline-grid">
              <input type="text" value="${escapeAttr(frame.name)}" data-frame-name="${frame.id}" placeholder="名称" />
              <input type="number" min="0" step="1" value="${sanitizeMin(frame.allocatedMin)}" data-frame-min="${frame.id}" />
            </div>
            <div class="item-actions">
              <button type="button" class="btn-secondary small-btn" data-select-frame="${frame.id}">選択</button>
              <button type="button" class="btn-danger-soft small-btn" data-remove-frame="${frame.id}">削除</button>
            </div>
          </div>
        `).join("")}
        <button type="button" class="btn-secondary" id="add-frame-btn">+ 大枠を追加</button>
      </div>
    `;
  }

  function renderBlockList() {
    if (!state.selection.frameId) {
      return `<div class="panel"><h3>中枠</h3><div class="empty-msg">先に大枠を選択</div></div>`;
    }
    const blocks = state.schedule.blocks.filter((b) => b.frameId === state.selection.frameId);
    return `
      <div class="panel">
        <h3>中枠</h3>
        ${blocks.map((block) => `
          <div class="list-item ${state.selection.blockId === block.id ? "selected" : ""}">
            <div class="inline-grid">
              <input type="text" value="${escapeAttr(block.name)}" data-block-name="${block.id}" placeholder="名称" />
              <input type="number" min="0" step="1" value="${sanitizeMin(block.allocatedMin)}" data-block-min="${block.id}" />
            </div>
            <div class="item-actions">
              <button type="button" class="btn-secondary small-btn" data-select-block="${block.id}">選択</button>
              <button type="button" class="btn-danger-soft small-btn" data-remove-block="${block.id}">削除</button>
            </div>
          </div>
        `).join("")}
        <button type="button" class="btn-secondary" id="add-block-btn">+ 中枠を追加</button>
      </div>
    `;
  }

  function renderUnitList() {
    if (!state.selection.blockId) {
      return `<div class="panel"><h3>小枠</h3><div class="empty-msg">先に中枠を選択</div></div>`;
    }
    const units = state.schedule.units.filter((u) => u.blockId === state.selection.blockId);
    return `
      <div class="panel">
        <h3>小枠</h3>
        ${units.map((unit) => `
          <div class="list-item">
            <div class="inline-grid">
              <input type="text" value="${escapeAttr(unit.name)}" data-unit-name="${unit.id}" placeholder="名称" />
              <input type="number" min="0" step="1" value="${sanitizeMin(unit.allocatedMin)}" data-unit-min="${unit.id}" />
            </div>
            <div class="item-actions">
              <button type="button" class="btn-danger-soft small-btn" data-remove-unit="${unit.id}">削除</button>
            </div>
          </div>
        `).join("")}
        <button type="button" class="btn-secondary" id="add-unit-btn">+ 小枠を追加</button>
      </div>
    `;
  }

  function renderSchedule() {
    updateWarnings();
    const screen = document.getElementById("schedule-screen");
    screen.innerHTML = `
      <div class="card">
        <h1>スケジュール作成</h1>
        <div class="summary-grid">
          <div class="summary-item"><div class="label">メニュー</div><div class="value">${menuLabel(state.survey.menuId)}</div></div>
          <div class="summary-item"><div class="label">総時間</div><div class="value">${state.survey.totalDurationMin ?? "-"}分</div></div>
          <div class="summary-item"><div class="label">重点部位件数</div><div class="value">${state.survey.focusAreas.length}件</div></div>
          <div class="summary-item"><div class="label">左右分割</div><div class="value">${state.survey.splitLeftRight ? "ON" : "OFF"}</div></div>
        </div>
      </div>

      <div class="card">
        <h2>大枠配分プレビュー</h2>
        ${renderStackedBar()}
      </div>

      <div class="card">
        <div class="three-columns">
          ${renderFrameList()}
          ${renderBlockList()}
          ${renderUnitList()}
        </div>
      </div>

      <div class="card">
        <h2>警告一覧（非ブロック）</h2>
        <div class="warnings">
          ${state.warnings.length === 0 ? "警告はありません。" : `<ul>${state.warnings.map((w) => `<li>${escapeHtml(w)}</li>`).join("")}</ul>`}
        </div>
        <div class="help">警告があっても「この内容で確定」は押せます。</div>
        <div class="btn-row" style="margin-top:14px;">
          <button id="back-btn" class="btn-secondary">戻る</button>
          <button id="confirm-btn" class="btn-primary">この内容で確定</button>
        </div>
      </div>

      <div class="card">
        <h3>payload プレビュー</h3>
        <div class="preview">${escapeHtml(JSON.stringify(state.schedule.confirmedPayload, null, 2) || "未確定")}</div>
      </div>
    `;

    screen.querySelector("#back-btn").addEventListener("click", () => {
      state.currentScreen = "survey";
      render();
    });

    screen.querySelector("#confirm-btn").addEventListener("click", () => {
      updateWarnings();
      state.schedule.confirmedPayload = generatePayload();
      render();
    });

    screen.querySelector("#add-frame-btn").addEventListener("click", () => {
      state.schedule.frames.push({ id: uid("frame"), name: "新しい大枠", allocatedMin: 0 });
      updateWarnings();
      render();
    });

    screen.querySelectorAll("[data-frame-name]").forEach((el) => {
      el.addEventListener("input", (e) => {
        const target = frameById(e.target.getAttribute("data-frame-name"));
        if (target) target.name = e.target.value;
        render();
      });
    });

    screen.querySelectorAll("[data-frame-min]").forEach((el) => {
      el.addEventListener("input", (e) => {
        const target = frameById(e.target.getAttribute("data-frame-min"));
        if (target) target.allocatedMin = sanitizeMin(e.target.value);
        updateWarnings();
        render();
      });
    });

    screen.querySelectorAll("[data-select-frame]").forEach((el) => {
      el.addEventListener("click", () => {
        selectFrame(el.getAttribute("data-select-frame"));
        render();
      });
    });

    screen.querySelectorAll("[data-remove-frame]").forEach((el) => {
      el.addEventListener("click", () => removeFrame(el.getAttribute("data-remove-frame")));
    });

    const addBlock = screen.querySelector("#add-block-btn");
    if (addBlock) {
      addBlock.addEventListener("click", () => {
        if (!state.selection.frameId) return;
        state.schedule.blocks.push({ id: uid("block"), frameId: state.selection.frameId, name: "新しい中枠", allocatedMin: 0 });
        updateWarnings();
        render();
      });
    }

    screen.querySelectorAll("[data-block-name]").forEach((el) => {
      el.addEventListener("input", (e) => {
        const target = blockById(e.target.getAttribute("data-block-name"));
        if (target) target.name = e.target.value;
        render();
      });
    });

    screen.querySelectorAll("[data-block-min]").forEach((el) => {
      el.addEventListener("input", (e) => {
        const target = blockById(e.target.getAttribute("data-block-min"));
        if (target) target.allocatedMin = sanitizeMin(e.target.value);
        updateWarnings();
        render();
      });
    });

    screen.querySelectorAll("[data-select-block]").forEach((el) => {
      el.addEventListener("click", () => {
        selectBlock(el.getAttribute("data-select-block"));
        render();
      });
    });

    screen.querySelectorAll("[data-remove-block]").forEach((el) => {
      el.addEventListener("click", () => removeBlock(el.getAttribute("data-remove-block")));
    });

    const addUnit = screen.querySelector("#add-unit-btn");
    if (addUnit) {
      addUnit.addEventListener("click", () => {
        if (!state.selection.blockId) return;
        state.schedule.units.push({ id: uid("unit"), blockId: state.selection.blockId, name: "新しい小枠", allocatedMin: 0 });
        updateWarnings();
        render();
      });
    }

    screen.querySelectorAll("[data-unit-name]").forEach((el) => {
      el.addEventListener("input", (e) => {
        const id = e.target.getAttribute("data-unit-name");
        const target = state.schedule.units.find((u) => u.id === id);
        if (target) target.name = e.target.value;
        render();
      });
    });

    screen.querySelectorAll("[data-unit-min]").forEach((el) => {
      el.addEventListener("input", (e) => {
        const id = e.target.getAttribute("data-unit-min");
        const target = state.schedule.units.find((u) => u.id === id);
        if (target) target.allocatedMin = sanitizeMin(e.target.value);
        updateWarnings();
        render();
      });
    });

    screen.querySelectorAll("[data-remove-unit]").forEach((el) => {
      el.addEventListener("click", () => removeUnit(el.getAttribute("data-remove-unit")));
    });
  }

  function escapeHtml(str) {
    return String(str)
      .replaceAll("&", "&amp;")
      .replaceAll("<", "&lt;")
      .replaceAll(">", "&gt;")
      .replaceAll('"', "&quot;")
      .replaceAll("'", "&#039;");
  }

  function escapeAttr(str) {
    return escapeHtml(str ?? "");
  }

  function render() {
    const surveyScreen = document.getElementById("survey-screen");
    const scheduleScreen = document.getElementById("schedule-screen");

    if (state.currentScreen === "survey") {
      surveyScreen.classList.add("active");
      scheduleScreen.classList.remove("active");
      renderSurvey();
    } else {
      surveyScreen.classList.remove("active");
      scheduleScreen.classList.add("active");
      renderSchedule();
    }
  }

  render();
</script>
</body>
</html>
